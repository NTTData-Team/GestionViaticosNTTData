spring:
  application:
    name: viatico-ms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/viaticodb}
    username: ${SPRING_DATASOURCE_USERNAME:viaticouser}
    password: ${SPRING_DATASOURCE_PASSWORD:viaticopass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka}
  instance:
    prefer-ip-address: true
